[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not live_demo and not injection and not control and not resilience and not metamorphic"
markers =
    live_demo: Talk 2 - intentionally exposes failures during the presentation
    injection: Talk 3 - injected tool result, run N times
    control: Talk 3 - tests that guard the booking control itself
    permission: Talk 3 - what the agent can reach (security boundary)
    resilience: Talk 3 - the search tool is down; one prepared run fails on purpose
    metamorphic: Talk 3 - same request, reworded; one prepared run fails on purpose
